<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Results - AI Interview System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="./styles/results.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 id="interviewTypeHeading" class="text-center text-primary my-4"></h1>
        <div class="card shadow-lg mb-5 p-4 text-center header-card">
            <i class="bi bi-check-circle-fill text-success mb-3" style="font-size: 3rem;"></i>
            <h1 class="display-6 fw-bold text-dark" id="interviewAnalysisHeading"></h1>
            <p class="lead text-muted">Review the detailed breakdown of your technical interview performance below.</p>

            
            <div class="row justify-content-center mt-4 pt-3 border-top summary-stats">
                <div class="col-6 col-md-4 mb-3">
                    <div class="p-3 bg-light rounded shadow-sm h-100">
                        <div class="fs-2 fw-bold text-primary" id="totalQuestions">0</div>
                        <div class="text-uppercase text-muted small">Questions Answered</div>
                    </div>
                </div>
                <div class="col-6 col-md-4 mb-3">
                    <div class="p-3 bg-light rounded shadow-sm h-100">
                        <div class="fs-2 fw-bold text-success" id="averageScore">0.0</div>
                        <div class="text-uppercase text-muted small">Average Score (out of 10.0)</div>
                    </div>
                </div>
            </div>

            
            <div class="mt-4 action-buttons">
                <button class="btn btn-outline-primary btn-lg shadow-sm" onclick="window.location.href='index.html'">
                    <i class="bi bi-house-door-fill me-2"></i> Back to Home
                </button>
            </div>
        </div>

        
        <div id="analysisContainer">
        
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="./scripts/results.js"></script>
</body>
</html>
