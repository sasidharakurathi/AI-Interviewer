<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview in Progress - AI Interview System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./styles/interview.css">

    <style>
        #alertContainer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 50%;
            transform: translateX(50%);
            z-index: 1050;
        }
    </style>

</head>
<body>
    <div class="interview-container">
        <h1 id="interviewTypeHeading" class="text-center text-primary my-4"></h1>
        <div class="loading-section" id="loadingSection">
            <div class="spinner"></div>
            <h2>Generating Interview Questions...</h2>
            <p class="text-muted">Please wait while we prepare your personalized interview</p>
        </div>

        <div class="question-section" id="questionSection">
            <div class="progress-header">
                <div class="question-number" id="questionNumber">Question 1 of 5</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar" style="width: 20%"></div>
                </div>
            </div>

            <div class="question-text" id="questionText">
                Your question will appear here...
            </div>

            <div class="recording-controls">
                <button class="btn record-btn start" id="recordBtn" onclick="toggleRecording()">
                    <i class="bi bi-mic-fill"></i> Start Recording
                </button>

                <div class="recording-indicator" id="recordingIndicator">
                    <span class="recording-dot"></span>
                    Recording in progress...
                </div>

                <div class="processing-message" id="processingMessage">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Processing your answer...</p>
                </div>
            </div>

        </div>
    </div>

    <div class="completedContainer" class="text-center"></div>

    <div id="alertContainer" class="text-center"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./scripts/start-interview.js"></script>
</body>
</html>
